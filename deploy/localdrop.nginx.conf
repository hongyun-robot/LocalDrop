server {
    listen 80;
    listen [::]:80;
    server_name localdrop.zhanghongyun.cn;

    return 301 https://localdrop.zhanghongyun.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localdrop.zhanghongyun.cn;

    ssl_certificate     /etc/nginx/ssl/zhanghongyun.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zhanghongyun.cn/certkey.pem;

    access_log /var/log/nginx/localdrop.access.log;
    error_log  /var/log/nginx/localdrop.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
